# EC2 nodes (ADR 0002 §1). Not used by the Docker test. Counts are placeholders until the GPU count is
# decided. State=CLOUD lets Slurm start and stop the instances, so idle nodes do not cost money.
# SuspendExcNodes=gpu-[1-9]:1 keeps exactly one idle GPU node running: the hot spare.
# The ec2_suspend.sh / ec2_resume.sh scripts are week-2 work (they need the AWS account).
SuspendProgram=/opt/v5/submission/slurm/ec2_suspend.sh
ResumeProgram=/opt/v5/submission/slurm/ec2_resume.sh
SuspendTime=600
SuspendExcNodes=gpu-[1-9]:1
ResumeTimeout=900
NodeName=gpu-[1-9] CPUs=192 RealMemory=2000000 Gres=gpu:b200:8 Feature=efa State=CLOUD
NodeName=eval-[1-2] CPUs=48 RealMemory=380000 Gres=gpu:l40s:4 State=CLOUD
NodeName=cpu-[1-4] CPUs=64 RealMemory=250000 State=CLOUD
PartitionName=gpu   Nodes=gpu-[1-9] Default=YES MaxTime=INFINITE OverSubscribe=EXCLUSIVE State=UP
PartitionName=eval  Nodes=eval-[1-2] MaxTime=04:00:00 State=UP
PartitionName=debug Nodes=gpu-[1-9] MaxTime=00:30:00 State=UP
PartitionName=cpu   Nodes=cpu-[1-4] MaxTime=1-00:00:00 State=UP
